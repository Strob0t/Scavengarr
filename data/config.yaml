# ----------------------------------------------------------------------
# Scavengarr Configuration
# ----------------------------------------------------------------------
# Precedence (high → low):
#   1. CLI arguments (--log-level, --config, etc.)
#   2. Environment variables (SCAVENGARR_*; .env values via --dotenv count as env, real env wins)
#   3. This YAML file
#   4. Built-in defaults
# ----------------------------------------------------------------------

# -- General ----------------------------------------------------------
app_name: "scavengarr"
environment: "prod" # dev | test | prod
tmdb_api_key: "" # env: SCAVENGARR_TMDB_API_KEY

# -- Plugins ----------------------------------------------------------
plugins:
  plugin_dir: "./plugins" # env: SCAVENGARR_PLUGIN_DIR
  overrides:
    # Dead since 2026-10: its API host db.videasy.net no longer resolves.
    # Remove the entry (or set enabled: true) when the site is back.
    cineby:
      enabled: false
  # Per-plugin overrides example:
  # overrides:
  #   kinoger:
  #     timeout: 20.0
  #     max_concurrent: 5
  #     max_results: 500
  #     enabled: false
  #   filmpalast:
  #     timeout: 30.0
  #   sto:
  #     max_concurrent: 2

# -- HTTP / Scraping --------------------------------------------------
http:
  timeout_seconds: 15.0 # was 30 — cut slow requests faster
  timeout_resolve_seconds: 10.0 # was 15 — hosters that need >10s are likely dead
  follow_redirects: true # env: SCAVENGARR_HTTP_FOLLOW_REDIRECTS
  http2: false # offer HTTP/2 (one connection per host); env: SCAVENGARR_HTTP_HTTP2
  # user_agent: default Scavengarr/<version> (+https://github.com/Strob0t/Scavengarr);
  # keep a contact URL in your own (Wikidata answers 403 without one)
  rate_limit_rps: 10.0 # was 5 — double throughput per domain
  rate_limit_adaptive: true # AIMD: rate grows on success, halves on 429/503
  rate_limit_min_rps: 0.5 # adaptive lower bound per domain
  rate_limit_max_rps: 50.0 # adaptive upper bound per domain
  api_rate_limit_rpm: 120 # env: SCAVENGARR_API_RATE_LIMIT_RPM (0 = off)
  retry_max_attempts: 2 # was 3 — fewer retries, fail faster
  retry_backoff_base: 0.5 # was 1.0 — shorter initial backoff
  retry_max_backoff: 10.0 # was 30 — cap retry wait at 10s instead of 30s

# -- Link Validation -------------------------------------------------
validate_download_links: true
validation_timeout_seconds: 3.0 # was 5.0 — HEAD checks should be fast
validation_max_concurrent: 30 # was 20 — more parallel validations

# -- Playwright -------------------------------------------------------
playwright:
  headless: false # headful under Xvfb (Cloudflare Turnstile), headless fallback without DISPLAY; env: SCAVENGARR_PLAYWRIGHT_HEADLESS
  browser_fallback: true # httpx plugins load Cloudflare-challenged pages via the browser; env: SCAVENGARR_PLAYWRIGHT_BROWSER_FALLBACK
  # solver_url: "http://byparr:8191" # optional Byparr/FlareSolverr sidecar (compose profile solver)
  timeout_ms: 20000 # was 30000 — 20s is plenty for page load

# -- Logging ----------------------------------------------------------
logging:
  level: "INFO" # env: SCAVENGARR_LOG_LEVEL (DEBUG|INFO|WARNING|ERROR)
  format: "json" # env: SCAVENGARR_LOG_FORMAT (json|console, auto if omitted)

# -- Cache ------------------------------------------------------------
cache:
  backend: "diskcache" # diskcache | redis; env: SCAVENGARR_CACHE_BACKEND
  dir: "./.cache/scavengarr" # env: SCAVENGARR_CACHE_DIR (Docker image: /app/cache)
  ttl_seconds: 3600 # env: SCAVENGARR_CACHE_TTL_SECONDS
  search_ttl_seconds: 1800 # was 900 — 30min cache, repeated searches are instant
  crawljob_ttl_seconds: 3600 # how long a grab stays downloadable
  max_concurrent: 10 # env: SCAVENGARR_CACHE_MAX_CONCURRENT
  # redis_url: "redis://redis:6379/0"      # env: SCAVENGARR_CACHE_REDIS_URL (only for backend: redis)

# -- Scoring (background plugin probing) ------------------------------
scoring:
  enabled: true # env: SCAVENGARR_SCORING_ENABLED
  health_halflife_days: 2.0
  search_halflife_weeks: 2.0
  health_interval_hours: 24.0
  search_runs_per_week: 2
  health_timeout_seconds: 5.0
  search_timeout_seconds: 10.0
  search_max_items: 20
  health_concurrency: 5
  search_concurrency: 3
  score_ttl_days: 30
  w_health: 0.4 # env: SCAVENGARR_SCORING_W_HEALTH
  w_search: 0.6 # env: SCAVENGARR_SCORING_W_SEARCH

# -- Stremio Addon ----------------------------------------------------
stremio:
  # Language & ranking
  preferred_language: "de"
  language_scores:
    "de": 1000
    "de-sub": 500
    "en-sub": 200
    "en": 150
  default_language_score: 100
  quality_multiplier: 10
  hoster_scores:
    "supervideo": 5
    "voe": 4
    "filemoon": 3
    "streamtape": 2
    "doodstream": 1

  # Concurrency
  max_concurrent_plugins: 15 # was 5 — let auto-tune go higher
  max_concurrent_plugins_auto: true # auto-tune based on CPU/RAM
  auto_tune_all: true # container-aware auto-tune ALL concurrency params (cgroup v2/v1)
  max_concurrent_playwright: 7 # was 5 — more parallel PW plugins
  max_results_per_plugin: 50 # was 100 — fewer results per plugin, faster turnaround
  # Answer policy (decided 2026-10-05, docs/plans/round5-measures.md): the
  # answer goes out at resolve_target_count streams or when the search and
  # every resolution are done, at the latest stream_deadline_seconds after
  # the request; links resolve while plugins search, and plugins still
  # running at the answer fill the search cache
  plugin_timeout_seconds: 30.0 # plugin search ends 30 s after the request
  stream_deadline_seconds: 60.0 # latest answer
  verify_streams: true # drop resolved URLs that do not return video bytes
  plugin_health_interval_seconds: 1800.0 # check every plugin's site; searches skip sites that did not answer (0 = off)
  allow_hls_transcoding: false # let Stremio's streaming server transcode HLS (too slow for 1080p on a Pi 4)

  # Title matching
  title_match_threshold: 0.7
  title_year_bonus: 0.2
  title_year_penalty: 0.3
  title_sequel_penalty: 0.35
  title_extra_words_penalty: 0.35 # result adds words: "Dark Matter" for "Dark"
  title_year_tolerance_movie: 1
  title_year_tolerance_series: 3

  # Stream link caching
  # Links behind /play and the HLS proxy: Stremio plays kept stream
  # objects later (autoplay, Continue Watching); stale ones resolve again
  stream_link_ttl_seconds: 604800 # 7 days

  # Hoster resolution at /stream time
  probe_concurrency: 20 # parallel resolutions (auto-tuned when auto_tune_all)
  max_probe_count: 80 # top-ranked streams to resolve (was 50)

  # The answer goes out once this many hosters have a video
  resolve_target_count: 5

  # Stealth browser (Patchright): browser-based resolvers, Cloudflare fallback
  probe_stealth_timeout_seconds: 10.0 # page timeout (default 15)

  # Scored plugin selection (requires scoring.enabled: true)
  scoring_enabled: false
  stremio_deadline_ms: 2000
  max_plugins_scored: 5
  max_items_total: 50
  max_items_per_plugin: 20
  exploration_probability: 0.15

# -- Telemetry --------------------------------------------------------
# telemetry:
#   tracing_endpoint: "http://tempo:4318" # OTLP/HTTP; the core's stages as OpenTelemetry spans (compose profile tracing); off when unset
