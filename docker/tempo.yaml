# Grafana Tempo 3.x, monolithic, local disk: on-demand traces of Scavengarr
# (docs/features/observability.md). Scavengarr sends OTLP/HTTP to port 4318
# (telemetry.tracing_endpoint), Grafana's Tempo data source queries port 3200.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Traces are for looking into recent requests
backend_worker:
  compaction:
    block_retention: 72h

usage_report:
  reporting_enabled: false
