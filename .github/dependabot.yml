# Weekly dependency updates; CI (ci.yml) runs on every pull request.
# PRs go to staging (main takes merges from staging only); merge rule: AGENTS.md §4.
# Every entry waits 7 days after a release (cooldown): a release pulled again
# within days never reaches staging. Security updates do not wait.
version: 2
updates:
  # Poetry (pyproject.toml, poetry.lock): Dependabot handles Poetry as "pip"
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # Actions in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"

  # Base images of Dockerfile.prod (Dependabot reads every file whose name
  # contains "dockerfile")
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"

  # The hook revs of .pre-commit-config.yaml
  - package-ecosystem: "pre-commit"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
