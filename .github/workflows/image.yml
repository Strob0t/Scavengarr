# Production image for linux/amd64 and linux/arm64 (Raspberry Pi), published
# to GHCR as one multi-arch manifest (openspec: add-container-image). Each
# architecture builds natively on its own runner and pushes its image by
# digest; the merge job tags the manifest list: `staging` (pushes to
# staging), `vX.Y.Z` and `latest` (release tags), `sha-<commit>` (every build).
name: Image

on:
  push:
    branches: [staging]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  # The commit as SCAVENGARR_COMMIT and the sha- tag carry it
  DOCKER_METADATA_SHORT_SHA_LENGTH: 12

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # GHCR names are lower case; the owner is not
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/scavengarr" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
          echo "COMMIT=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.prod
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SCAVENGARR_COMMIT=${{ env.COMMIT }}
            SCAVENGARR_BUILT=${{ env.BUILT }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # mode=max: the builder and browser stages too, or every build
          # downloads Chromium again
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: tag the multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Prepare
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/scavengarr" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest comes with the semver tag (flavor latest=auto)
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=sha

      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          # Compressed size per platform, what a first pull downloads
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" \
            | jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.architecture) \(.digest)"' \
            | while read -r arch digest; do
                bytes=$(docker buildx imagetools inspect --raw "$IMAGE@$digest" | jq '[.layers[].size] | add')
                echo "$arch: $((bytes / 1048576)) MiB compressed" | tee -a "$GITHUB_STEP_SUMMARY"
              done
