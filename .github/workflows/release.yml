# A release page per pushed tag, beside the image the image workflow
# publishes for it: the notes come from the tag's CHANGELOG.md section
# (scripts/release_notes.py, standard library only), and a tag without a
# section fails the run before a page exists.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release page
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create the release page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
