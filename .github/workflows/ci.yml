# Offline gate: the same checks as before every commit (AGENTS.md §1).
# Live smoke tests stay out: GitHub's datacenter IPs get harder Cloudflare
# challenges than a residential network, where the addon runs, so their results would
# not show what production sees.
name: CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]
  # Weekly on main (GitHub runs a schedule on the default branch only): a new
  # runner image, Python patch or Poetry release breaks it without a push
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pre-commit and pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.14 runs in the Docker image, 3.12 in the dev container
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      # Poetry must be on PATH before setup-python so it can cache the venv.
      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit
        run: poetry run pre-commit run --all-files --show-diff-on-failure

      - name: pytest
        run: poetry run pytest -n auto

  # The one check the main ruleset requires, so the matrix changes without the
  # ruleset. always(), not !cancelled(): a skipped required check counts as
  # passed.
  passed:
    name: CI passed
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg passed
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success
