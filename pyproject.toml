[tool.poetry]
name = "scavengarr"
version = "0.2.3"
description = "Self-hosted Stremio addon and Torznab indexer for Prowlarr, Sonarr and Radarr"
packages = [{include = "scavengarr", from = "src"}]

[tool.poetry.scripts]
start = "scavengarr.interfaces.cli:start"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.12,<3.14"
fastapi = "^0.142.2"
uvicorn = "^0.54.0"
patchright = "^1.63"
structlog = "^26.1.0"
diskcache = "^5.6.3"
pydantic-settings = "^2.15.0"
python-dotenv = "^1.2.4"
httpx = { version = "^0.28.1", extras = ["http2"] }
redis = {version = "^8.1.0", extras = ["redis"]}
guessit = "^4.4.0"
pyyaml = "^6.0"
rapidfuzz = "^3.14.3"
unidecode = "^1.4.0"
cryptography = "^50"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
requests = "^2.32.5"
ruff = "0.16.9"
pre-commit = "^4.5.1"
respx = "^0.23.1"
pytest-cov = "^7.0.0"
pytest-mock = "^3.15.1"
pytest-asyncio = "^1.3.0"
basedpyright = "^1.40.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: Integration tests (real infrastructure, mocked HTTP)",
    "live: Live smoke tests against real websites (require network)",
    "benchmark: Concurrency tuning benchmarks (slow, run manually)",
]
addopts = "-q --tb=short --ignore=tests/benchmark -m \"not live\""
filterwarnings = [
    "ignore:Stealth has already been applied:UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]  # I = Import sorting (isort equivalent)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# ruff 0.16 formats Python blocks in Markdown; the docs' snippets are
# hand-aligned and partly pseudo-code ("{ ... }"), so they stay as written
exclude = ["*.md"]

[tool.basedpyright]
# Same rules in the editor (VS Code/VSCodium extension) and on the command line
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src", "plugins"]
