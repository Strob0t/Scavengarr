repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      # 1) Sort imports only (I001 / I)
      - id: ruff-check
        name: ruff (sort imports)
        args: ["--select", "I", "--fix"]

      # 2) Rest lint/fix
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]

      # 3) Formatter zuletzt
      - id: ruff-format

  # Type check (standard mode, [tool.basedpyright] in pyproject.toml) with the
  # project venv, so it sees the installed dependencies; in a git worktree
  # the script finds the main checkout's venv (`poetry run` would create an
  # empty one there)
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: scripts/basedpyright.sh
        language: system
        types: [python]
        pass_filenames: false
